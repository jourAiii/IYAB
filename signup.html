<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب | إياب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="account-surface">
    <div data-shared-header></div>
    <main class="auth-page-main" id="main-content">
      <section class="auth-art-panel" aria-label="مشهد تراثي من عمارة المملكة"><span class="auth-vertical-ornament" aria-hidden="true"></span></section>
      <section class="auth-form-panel">
        <form class="auth-form" id="signup-form">
          <h1>إنشاء حساب</h1>
          <p class="form-lead">ابدأ رحلتك مع إياب</p>
          <div class="field"><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c.6-5 3.3-7 8-7s7.4 2 8 7"></path></svg><input name="name" type="text" placeholder="الاسم الكامل" autocomplete="name" required /></div></div>
          <div class="field"><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg><input name="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required /></div></div>
          <div class="field"><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><input name="password" type="password" placeholder="كلمة المرور" autocomplete="new-password" minlength="6" required /></div></div>
          <div class="field"><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><input name="confirmPassword" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password" minlength="6" required /></div></div>
          <label class="check-line"><input name="terms" type="checkbox" /><span>أوافق على <a class="auth-text-link" href="#">الشروط والأحكام</a></span></label>
          <button class="auth-submit" type="submit">إنشاء حساب</button>
          <p class="auth-switch">لديك حساب بالفعل؟ <a class="auth-text-link" href="login.html">تسجيل الدخول</a></p>
          <p class="auth-message" role="alert"></p>
        </form>
      </section>
    </main>
    <div data-shared-footer></div>
    <script src="auth.js"></script>
  <script src="translations.js"></script><script src="i18n.js"></script><script src="site-integration.js"></script></body>
</html>
