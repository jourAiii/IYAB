<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | إياب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="account-surface">
    <div data-shared-header></div>
    <main class="auth-page-main" id="main-content">
      <section class="auth-art-panel" aria-label="مشهد تراثي من عمارة المملكة"><span class="auth-vertical-ornament" aria-hidden="true"></span></section>
      <section class="auth-form-panel">
        <form class="auth-form" id="login-form">
          <h1>تسجيل الدخول</h1>
          <p class="form-lead">أهلًا بعودتك إلى إياب</p>
          <div class="field"><label for="login-email">البريد الإلكتروني</label><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg><input id="login-email" name="email" type="email" placeholder="أدخل بريدك الإلكتروني" autocomplete="email" required /></div></div>
          <div class="field"><label for="login-password">كلمة المرور</label><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><input id="login-password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required /><button class="password-toggle" type="button" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div>
          <div class="auth-options"><label class="check-line"><input name="remember" type="checkbox" checked /><span>تذكرني</span></label><a class="auth-text-link" href="#">نسيت كلمة المرور؟</a></div>
          <button class="auth-submit" type="submit">تسجيل الدخول</button>
          <p class="auth-switch">ليس لديك حساب؟ <a class="auth-text-link" href="signup.html">إنشاء حساب</a></p>
          <p class="auth-message" role="alert"></p>
        </form>
      </section>
    </main>
    <div data-shared-footer></div>
    <script src="auth.js"></script>
  <script src="translations.js"></script><script src="i18n.js"></script><script src="site-integration.js"></script></body>
</html>
